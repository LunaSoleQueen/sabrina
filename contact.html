<!DOCTYPE html>
<html>
<head>
<title>Contact</title>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="css/bootstrap.min.css">
<link rel="stylesheet" href="css/font-awesome.min.css">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow-x: hidden;
  font-family: 'Montserrat', sans-serif;
  color: #fff;
}

/* CURSOR OFF (ha kell marad) */
body {
  background: transparent !important;
  cursor: none !important;
}

/* BACKGROUND VIDEO */
#bg-video {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -2;
}

/* DARK OVERLAY */
.overlay {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at center,
    rgba(0,0,0,0.35),
    rgba(0,0,0,0.88)
  );
  z-index: -1;
}

/* NAVBAR */
.navbar-nav {
  width: 100%;
  text-align: center;
  margin-top: 25px;
}

.navbar-nav > li {
  float: none;
  display: inline-block;
}

.navbar-nav > li > a {
  color: #d4af37 !important;
  font-weight: 600;
  letter-spacing: 2px;
  transition: 0.3s;
}

.navbar-nav > li > a:hover {
  color: #fff !important;
  text-shadow: 0 0 10px rgba(212,175,55,0.6);
}

/* CENTER WRAP */
.center-wrap {
  min-height: 85vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
}

/* GLASS CONTACT CARD */
.contact-card {
  width: 100%;
  max-width: 1100px;

  display: flex;
  gap: 30px;
  flex-wrap: wrap;

  padding: 50px;

  background: rgba(130, 70, 200, 0.14);
  border: 1px solid rgba(212, 175, 55, 0.25);
  border-radius: 22px;

  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);

  box-shadow: 0 0 60px rgba(212, 175, 55, 0.12);

  animation: fadeIn 1.1s ease forwards;
  opacity: 0;
}

/* LEFT SIDE */
.contact-form {
  flex: 1;
  min-width: 280px;
}

/* RIGHT SIDE */
.contact-map {
  flex: 1;
  min-width: 280px;
  height: 320px;
  border-radius: 14px;
  background: rgba(0,0,0,0.4);
}

/* TITLE */
.contact-form h1 {
  font-size: 40px;
  color: #d4af37;
  margin-bottom: 10px;
  letter-spacing: 3px;
}

.contact-form p {
  margin-bottom: 20px;
  font-weight: 300;
  color: rgba(255,255,255,0.85);
}

/* INPUTS */
input, textarea {
  width: 100%;
  margin-bottom: 12px;
  padding: 12px 14px;

  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 10px;

  background: rgba(0,0,0,0.35);
  color: #fff;

  outline: none;
  transition: 0.3s;
}

input:focus, textarea:focus {
  border-color: #d4af37;
  box-shadow: 0 0 12px rgba(212,175,55,0.25);
}

/* BUTTON */
button {
  width: 100%;
  padding: 12px;

  background: rgba(212, 175, 55, 0.9);
  color: #000;

  border: none;
  border-radius: 10px;

  font-weight: 600;
  letter-spacing: 2px;

  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #fff;
  color: #000;
}

/* ANIMATION */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(25px); }
  to { opacity: 1; transform: translateY(0); }
}

/* MOBILE */
@media (max-width: 768px) {
  .contact-card {
    padding: 25px;
  }
}
</style>

</head>

<body>

<!-- BACKGROUND -->
<video autoplay muted loop playsinline id="bg-video">
  <source src="images/web_bg_kicsi.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<!-- MENU -->
<div class="container menu">
  <div class="row">
    <div class="col-sm-12">
      <ul class="nav navbar-nav">
        <li><a href="index.html">HOME</a></li>
        <li><a href="about.html">ABOUT</a></li>
        <li><a href="gallery.html">GALLERY</a></li>
        <li class="current"><a href="contact.html">CONTACT</a></li>
      </ul>
    </div>
  </div>
</div>

<!-- CONTENT -->
<div class="center-wrap">
  <div class="contact-card">

    <!-- FORM -->
    <div class="contact-form">
      <h1>CONTACT</h1>
      <p>Send me a message</p>

      <form>
        <input type="text" placeholder="NAME">
        <input type="email" placeholder="EMAIL">
        <textarea rows="6" placeholder="MESSAGE"></textarea>
        <button type="submit">SEND</button>
      </form>
    </div>

    <!-- MAP -->
    <div class="contact-map"></div>

  </div>
</div>

</body>
</html>
