<!DOCTYPE html>
<html>
<head>
<title>Contact</title>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="css/bootstrap.min.css">
<link rel="stylesheet" href="css/font-awesome.min.css">
<link rel="stylesheet" href="css/cursor.css?v=2">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow-x: hidden;
  font-family: 'Montserrat', sans-serif;

  /* CUSTOM CURSOR ON */
  cursor: none !important;
  color: #fff;
}

/* BACKGROUND VIDEO */
#bg-video {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -2;
}

/* DARK CINEMATIC OVERLAY */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at center,
    rgba(0,0,0,0.35),
    rgba(0,0,0,0.88)
  );
  z-index: -1;
}

/* MENU (GOLD LUXURY STYLE) */
.navbar-nav {
  width: 100%;
  text-align: center;
  margin-top: 20px;
}

.navbar-nav > li {
  float: none;
  display: inline-block;
}

.navbar-nav > li > a {
  color: #d4af37 !important;
  font-weight: 600;
  letter-spacing: 2px;
  transition: 0.3s;
}

.navbar-nav > li > a:hover {
  color: #ffffff !important;
}

/* CENTER WRAP */
.center-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 80vh;
  padding: 30px;
}

/* GLASS BOX */
.glass-box {
  width: 100%;
  max-width: 1000px;

  padding: 50px;
  border-radius: 20px;

  background: rgba(130, 70, 200, 0.18);
  border: 1px solid rgba(212, 175, 55, 0.25);

  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);

  box-shadow: 0 0 40px rgba(212,175,55,0.15);
}

/* TITLE */
.glass-box h1 {
  text-align: center;
  font-size: 42px;
  letter-spacing: 4px;
  color: #d4af37;
  margin-bottom: 10px;
}

/* SUBTEXT */
.glass-box p {
  text-align: center;
  font-size: 16px;
  font-weight: 300;
  margin-bottom: 40px;
  color: #eee;
}

/* FORM */
input, textarea {
  width: 100%;
  margin-bottom: 12px;
  padding: 12px;

  border: none;
  border-radius: 8px;

  background: rgba(255,255,255,0.08);
  color: #fff;
}

button {
  background: #d4af37;
  color: #000;
  border: none;

  padding: 12px 25px;
  border-radius: 8px;

  font-weight: 600;
  letter-spacing: 1px;

  cursor: none;
}

/* MAP */
.map-box {
  width: 100%;
  height: 300px;
  border-radius: 12px;
  background: rgba(0,0,0,0.4);
}

</style>

</head>

<body>

<!-- CURSOR -->
<div class="cursor-dot"></div>

<!-- BACKGROUND -->
<video autoplay muted loop playsinline id="bg-video">
  <source src="images/web_bg_kicsi.mp4" type="video/mp4">
</video>

<!-- MENU -->
<div class="container menu">
  <div class="row">
    <div class="col-sm-12">
      <ul class="nav navbar-nav">
        <li><a href="index.html">HOME</a></li>
        <li><a href="about.html">ABOUT</a></li>
        <li><a href="gallery.html">GALLERY</a></li>
        <li class="current"><a href="contact.html">CONTACT</a></li>
      </ul>
    </div>
  </div>
</div>

<!-- CONTENT -->
<div class="center-wrap">

  <div class="glass-box">

    <h1>CONTACT</h1>
    <p>Send a message and I will respond as soon as possible</p>

    <div class="row">

      <div class="col-md-6">
        <form>
          <input type="text" placeholder="NAME">
          <input type="email" placeholder="EMAIL">
          <textarea rows="6" placeholder="MESSAGE"></textarea>
          <button type="submit">SEND</button>
        </form>
      </div>

      <div class="col-md-6">
        <div class="map-box"></div>
      </div>

    </div>

  </div>

</div>

  <script src="js/cursor.js?v=2"></script>
  
</body>
</html>
