<!DOCTYPE html>
<html>
<head>
<title>Home</title>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="css/bootstrap.min.css">
<link rel="stylesheet" href="css/font-awesome.min.css">
<link rel="stylesheet" href="css/templatemo_style.css">

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow-x: hidden;
}

body {
    background: transparent !important;
}

/* BACKGROUND */
#bg-video {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -1;
}

.container {
    position: relative;
    z-index: 1;
}

/* MENU */
.menu {
    margin-top: 50px;
}

/* BOX STÍLUS */
.box-style {
    background: rgba(130,70,200,.45);
    border: 2px solid #ff66cc;
    border-radius: 16px;
    color: #fff;
    padding: 20px;
    margin-bottom: 15px;
    backdrop-filter: blur(5px);
}

/* HERO */
.hero-img {
    width: 100%;
    height: 533px;
    object-fit: cover;
    border-radius: 16px;
}

/* DONATE FULL WIDTH */
.paypal-section {
    background: rgba(130,70,200,.45);
    border: 2px solid #ff66cc;
    border-radius: 16px;
    padding: 25px;
    text-align: center;
    color: #fff;
    backdrop-filter: blur(5px);
}

.paypal-title {
    font-size: 24px;
    letter-spacing: 4px;
    font-weight: 600;
    white-space: nowrap;
}

.paypal-subtitle {
    font-size: 13px;
    opacity: 0.9;
    margin-bottom: 15px;
    white-space: nowrap;
}

/* PayPal center */
#paypal-container-2FGRU9WXMWF8U {
    display: flex;
    justify-content: center;
    width: 100%;
}

/* COUNTER */
.site-counter {
    position: fixed;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    z-index: 9999;
}

.counter-box {
    background: rgba(130,70,200,.55);
    border: 2px solid #ff66cc;
    color: #fff;
    padding: 8px 12px;
    border-radius: 12px;
    font-size: 13px;
}

.counter-box.online {
    border-color: #00ffcc;
}
</style>

</head>

<body>

<!-- BACKGROUND -->
<video autoplay muted loop playsinline id="bg-video">
    <source src="images/web_bg_kicsi.mp4" type="video/mp4">
</video>

<!-- MENU -->
<div class="container menu">
    <div class="row">
        <div class="col-sm-4">
            <img src="images/logo lsq vége.png" style="max-width:180px;">
        </div>

        <div class="col-sm-8">
            <ul class="nav navbar-nav">
                <li class="current"><a href="index.html">HOME</a></li>
                <li><a href="about.html">ABOUT</a></li>
                <li><a href="gallery.html">GALLERY</a></li>
                <li><a href="contact.html">CONTACT</a></li>
            </ul>
        </div>
    </div>
</div>

<!-- HERO -->
<div class="container">
    <div class="row">

        <div class="col-md-8">
            <div class="box-style">
                <h1>WELCOME</h1>
                <p>Full screen video background site.</p>
            </div>
        </div>

        <div class="col-md-4">
            <img class="hero-img" src="images/P1100190_home01m.jpg">
        </div>

    </div>
</div>

<!-- MAIN BOXES -->
<div class="container">
    <div class="row">

        <div class="col-md-4">
            <div class="box-style">LEFT BOX</div>
        </div>

        <div class="col-md-4">
            <div class="box-style">CENTER BOX</div>
        </div>

        <div class="col-md-4">
            <div class="box-style">RIGHT BOX</div>
        </div>

    </div>

    <!-- DONATE FULL WIDTH (3 COL SPAN) -->
    <div class="row">
        <div class="col-md-12">

            <div class="paypal-section">

                <div class="paypal-title">DONATE</div>
                <div class="paypal-subtitle">Support the project</div>

                <div id="paypal-container-2FGRU9WXMWF8U"></div>

            </div>

        </div>
    </div>
</div>

<!-- PAYPAL -->
<script src="https://www.paypal.com/sdk/js?client-id=BAAEP5UkBLYS865bY3McFMLTe6Qw6QGPYZr34QpepJMoyToFFDRfYW9P0GLHBJ6rW5QiktDmcXkcn9PAJM&components=hosted-buttons&disable-funding=venmo&currency=USD"></script>

<script>
window.addEventListener("load", function () {
    paypal.HostedButtons({
        hostedButtonId: "2FGRU9WXMWF8U",
    }).render("#paypal-container-2FGRU9WXMWF8U");
});
</script>

</body>
</html>
