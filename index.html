<!DOCTYPE html>
<html>
<head>
<title>Home</title>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="css/bootstrap.min.css">
<link rel="stylesheet" href="css/font-awesome.min.css">
<link rel="stylesheet" href="css/templatemo_style.css">
<link rel="stylesheet" href="css/cursor.css?v=2">

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow-x: hidden;
    cursor: none !important;
}

body {
    background: transparent !important;
}

#bg-video {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -1;
}

.container {
    position: relative;
    z-index: 1;
}

.menu {
    margin-top: 50px;
}

/* BOXOK */
.templatemo_home_top_left,
.templatemo_home_midleft,
.templatemo_home_midmid,
.templatemo_home_midright {
    background: rgba(130,70,200,.45);
    border: 2px solid #ff66cc;
    border-radius: 16px;
    color: #fff;
    padding: 20px;
    margin-bottom: 15px;
}

/* STACK LEFT COLUMN */
.left-column {
    display: block;
}

/* STACK CENTER COLUMN */
.center-column {
    display: block;
}

/* 💜 DONATE BOX */
.paypal-section {
    padding: 25px 20px;
    background: rgba(130,70,200,.45);
    border: 2px solid #ff66cc;
    border-radius: 16px;
    text-align: center;
    color: #fff;
    width: 100%;
    box-sizing: border-box;
}

/* DONATE TITLE */
.paypal-title {
    font-size: 26px;
    font-weight: 600;
    letter-spacing: 6px;
    margin-bottom: 5px;
}

.paypal-subtitle {
    font-size: 13px;
    opacity: 0.8;
    margin-bottom: 15px;
}

/* PayPal container */
#paypal-container-2FGRU9WXMWF8U {
    width: 100% !important;
    display: flex;
    justify-content: center;
}

/* COUNTER */
.site-counter {
    position: fixed;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    z-index: 9999;
}

.counter-box {
    background: rgba(130,70,200,.55);
    border: 2px solid #ff66cc;
    color: #fff;
    padding: 8px 12px;
    border-radius: 12px;
    font-size: 13px;
}

.counter-box.online {
    border-color: #00ffcc;
}
</style>

</head>

<body>

<div class="cursor-dot"></div>

<!-- BACKGROUND -->
<video autoplay muted loop playsinline id="bg-video">
    <source src="images/web_bg_kicsi.mp4" type="video/mp4">
</video>

<!-- MENU -->
<div class="container menu">
    <div class="row">
        <div class="col-sm-4">
            <img src="images/logo lsq vége.png" style="max-width:180px;">
        </div>

        <div class="col-sm-8">
            <ul class="nav navbar-nav">
                <li class="current"><a href="index.html">HOME</a></li>
                <li><a href="about.html">ABOUT</a></li>
                <li><a href="gallery.html">GALLERY</a></li>
                <li><a href="contact.html">CONTACT</a></li>
            </ul>
        </div>
    </div>
</div>

<!-- HERO -->
<div class="container">
    <div class="row">
        <div class="col-md-8">
            <div class="templatemo_home_top_left">
                <h1>WELCOME</h1>
                <p>Full screen video background site.</p>
            </div>
        </div>

        <div class="col-md-4">
            <img class="hero-img" src="images/P1100190_home01m.jpg">
        </div>
    </div>
</div>

<!-- MAIN ROW -->
<div class="container">
    <div class="row">

        <!-- LEFT COLUMN -->
        <div class="col-md-4 left-column">

            <div class="templatemo_home_midleft">LEFT BOX</div>

            <!-- 💜 DONATE UNDER LEFT -->
            <div class="paypal-section">
                <div class="paypal-title">DONATE</div>
                <div class="paypal-subtitle">Support the project</div>
                <div id="paypal-container-2FGRU9WXMWF8U"></div>
            </div>

        </div>

        <!-- CENTER -->
        <div class="col-md-4">
            <div class="templatemo_home_midmid">CENTER BOX</div>
        </div>

        <!-- RIGHT -->
        <div class="col-md-4">
            <div class="templatemo_home_midright">RIGHT BOX</div>
        </div>

    </div>
</div>

<!-- PAYPAL SDK -->
<script src="https://www.paypal.com/sdk/js?client-id=BAAEP5UkBLYS865bY3McFMLTe6Qw6QGPYZr34QpepJMoyToFFDRfYW9P0GLHBJ6rW5QiktDmcXkcn9PAJM&components=hosted-buttons&disable-funding=venmo&currency=USD"></script>

<script>
paypal.HostedButtons({
  hostedButtonId: "2FGRU9WXMWF8U",
}).render("#paypal-container-2FGRU9WXMWF8U");
</script>

<script src="js/cursor.js?v=2"></script>

</body>
</html>
