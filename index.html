<!DOCTYPE html>
<html>
<head>
<title>Home</title>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="css/bootstrap.min.css">
<link rel="stylesheet" href="css/font-awesome.min.css">
<link rel="stylesheet" href="css/cursor.css?v=2">

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow-x: hidden;
    background: transparent;
    cursor: none !important;
    font-family: Arial, sans-serif;
}

/* BACKGROUND */
#bg-video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -2;
}

/* OVERLAY */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center,
        rgba(0,0,0,0.35),
        rgba(0,0,0,0.85)
    );
    z-index: -1;
}

/* CURSOR (NINCS DUPLIKÁCIÓ — CSAK CSS BETÖLTÉS) */
.cursor-dot {
    position: fixed;
    width: 12px;
    height: 12px;
    background: radial-gradient(circle, #b56bff, #6a00ff);
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%);
    z-index: 999999;
    box-shadow: 0 0 15px #b56bff;
}

/* MENU */
.container {
    position: relative;
    z-index: 1;
}

.menu {
    margin-top: 40px;
}

/* BOX STYLE */
.box {
    background: rgba(130,70,200,.35);
    border: 2px solid #ff66cc;
    border-radius: 16px;
    color: #fff;
    padding: 20px;
    backdrop-filter: blur(8px);
}

/* FIX HEIGHTS */
.top-box {
    min-height: 500px;
}

.mid-box {
    min-height: 140px;
}

/* HERO */
.hero-img {
    width: 100%;
    height: 533px;
    object-fit: cover;
    border-radius: 16px;
}

/* PAYPAL FIX (FONTOS) */
.paypal-wrapper {
    margin-top: 15px;
    padding: 18px;
    border-radius: 16px;
    border: 2px solid #ff66cc;
    background: rgba(130,70,200,.35);

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
}
.paypal-wrapper {
    min-width: 280px;
}
#paypal-container-2FGRU9WXMWF8U {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* PayPal iframe védelme */
#paypal-container-2FGRU9WXMWF8U iframe {
    max-width: 100% !important;
}

/* COUNTER */
.site-counter {
    position: fixed;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    z-index: 9999;
}

.counter-box {
    background: rgba(130,70,200,.55);
    border: 2px solid #ff66cc;
    color: #fff;
    padding: 8px 12px;
    border-radius: 12px;
    font-size: 13px;
}

.counter-box.online {
    border-color: #00ffcc;
}

</style>

</head>

<body>

<!-- CURSOR -->
<div class="cursor-dot"></div>

<!-- BACKGROUND -->

    <source src="images/web_bg_kicsi.mp4" type="video/mp4">
</video>

        </div>

        <div class="col-sm-8">
            <ul class="nav navbar-nav">
                <li class="current"><a href="index.html">HOME</a></li>
                <li><a href="about.html">ABOUT</a></li>
                <li><a href="gallery.html">GALLERY</a></li>
                <li><a href="contact.html">CONTACT</a></li>
            </ul>
        </div>
    </div>
</div>

<!-- HERO -->
<div class="container">
    <div class="row">

        <div class="col-md-8">
            <div class="box top-box">
                <h1>WELCOME</h1>
                <p>Luxury video background site</p>
            </div>
        </div>

        <div class="col-md-4">
            <img class="hero-img" src="images/P1100190_home01m.jpg">
        </div>

    </div>
</div>

<!-- MAIN -->
<div class="container">
    <div class="row">

        <div class="col-md-4">
            <div class="box mid-box">LEFT BOX</div>

            <div class="paypal-wrapper">
                <div id="paypal-container-2FGRU9WXMWF8U"></div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="box mid-box">CENTER BOX</div>
        </div>

<!-- COUNTER -->
<div class="site-counter">
    <div class="counter-box">Today: <span id="today"></span></div>
    <div class="counter-box">Yesterday: <span id="yesterday"></span></div>
    <div class="counter-box">All: <span id="all"></span></div>
    <div class="counter-box online">Online: <span id="online"></span></div>
</div>

<script>
(function(){

    let today = localStorage.getItem("today") || 0;
    let yesterday = localStorage.getItem("yesterday") || 0;
    let all = localStorage.getItem("all") || 0;

    const last = localStorage.getItem("lastVisit");
    const now = new Date().toDateString();

    if(last !== now){
        yesterday = today;
        today = 0;
    }

    today = +today + 1;
    all = +all + 1;

    localStorage.setItem("today", today);
    localStorage.setItem("yesterday", yesterday);
    localStorage.setItem("all", all);
    localStorage.setItem("lastVisit", now);

    document.getElementById("today").innerText = today;
    document.getElementById("yesterday").innerText = yesterday;
    document.getElementById("all").innerText = all;
    document.getElementById("online").innerText = 1;

})();
</script>

<script src="js/cursor.js?v=2"></script>

</body>
</html>
