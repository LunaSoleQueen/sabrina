<!DOCTYPE html>
<html>
<head>
<title>Home</title>

<link rel="stylesheet" href="css/bootstrap.min.css">
<link rel="stylesheet" href="css/font-awesome.min.css">
<link rel="stylesheet" href="css/templatemo_style.css">

<link rel="stylesheet" href="css/cursor.css?v=2">

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow-x: hidden;
    cursor: none !important;
}

body {
    background: transparent !important;
}

#bg-video {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -1;
}

.container {
    position: relative;
    z-index: 1;
}

.menu {
    margin-top: 50px;
}

.navbar-nav {
    width: 100%;
}

/* BOXOK */
.templatemo_home_top_left,
.templatemo_home_midleft,
.templatemo_home_midmid,
.templatemo_home_midright {
    background: rgba(130,70,200,.45);
    border: 2px solid #ff66cc;
    border-radius: 16px;
    color: #fff;
    padding: 20px;
}

/* FLEX ROW */
.row-flex {
    display: flex;
    flex-wrap: wrap;
    align-items: stretch;
}

.row-flex > div {
    display: flex;
}

.row-flex > div > div {
    width: 100%;
}

/* 💜 PAYPAL SECTION (FIXED + MATCH DESIGN) */
.paypal-section {
    margin-top: 25px;
    padding: 20px;
    background: rgba(130,70,200,.45); /* same as boxes */
    border: 2px solid #ff66cc;
    border-radius: 16px;
    color: #fff;
    text-align: center;

    width: 100%;
    overflow: hidden;
}

.paypal-title {
    font-size: 18px;
    margin-bottom: 15px;
}

#paypal-container-2FGRU9WXMWF8U {
    width: 100% !important;
    min-width: 320px;
}

/* PayPal iframe safety */
.paypal-section iframe {
    max-width: 100% !important;
}

/* COUNTER */
.site-counter {
    position: fixed;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    z-index: 9999;
}

.counter-box {
    background: rgba(130,70,200,.55);
    border: 2px solid #ff66cc;
    color: #fff;
    padding: 8px 12px;
    border-radius: 12px;
    font-size: 13px;
}

.counter-box.online {
    border-color: #00ffcc;
}
</style>

</head>

<body>

<!-- CURSOR -->
<div class="cursor-dot"></div>

<!-- BACKGROUND -->
<video autoplay muted loop playsinline id="bg-video">
    <source src="images/web_bg_kicsi.mp4" type="video/mp4">
</video>

<!-- MENU -->
<div class="container menu">
    <div class="row">
        <div class="col-sm-4">
            <img src="images/logo lsq vége.png" style="max-width:180px;">
        </div>

        <div class="col-sm-8">
            <ul class="nav navbar-nav">
                <li class="current"><a href="index.html">HOME</a></li>
                <li><a href="about.html">ABOUT</a></li>
                <li><a href="gallery.html">GALLERY</a></li>
                <li><a href="contact.html">CONTACT</a></li>
            </ul>
        </div>
    </div>
</div>

<!-- HERO -->
<div class="container">
    <div class="row">
        <div class="col-md-8">
            <div class="templatemo_home_top_left">
                <h1>WELCOME</h1>
                <p>Full screen video background site.</p>
            </div>
        </div>

        <div class="col-md-4">
            <img class="hero-img" src="images/P1100190_home01m.jpg">
        </div>
    </div>
</div>

<!-- MID BOXES -->
<div class="container">
    <div class="row row-flex">

        <div class="col-md-4">
            <div class="templatemo_home_midleft">LEFT BOX</div>
        </div>

        <div class="col-md-4">
            <div class="templatemo_home_midmid">CENTER BOX</div>
        </div>

        <div class="col-md-4">
            <div class="templatemo_home_midright">RIGHT BOX</div>
        </div>

    </div>
</div>

<!-- 💜 PAYPAL (CENTER ALÁ) -->
<div class="container">
    <div class="row">
        <div class="col-md-12">

            <div class="paypal-section">
                <div class="paypal-title">💜 Support the project</div>

                <div id="paypal-container-2FGRU9WXMWF8U"></div>
            </div>

        </div>
    </div>
</div>

<!-- COUNTER -->
<div class="site-counter">
    <div class="counter-box">Today: <span id="today"></span></div>
    <div class="counter-box">Yesterday: <span id="yesterday"></span></div>
    <div class="counter-box">All: <span id="all"></span></div>
    <div class="counter-box online">Online: <span id="online"></span></div>
</div>

<!-- PAYPAL SDK -->
<script 
  src="https://www.paypal.com/sdk/js?client-id=BAAEP5UkBLYS865bY3McFMLTe6Qw6QGPYZr34QpepJMoyToFFDRfYW9P0GLHBJ6rW5QiktDmcXkcn9PAJM&components=hosted-buttons&disable-funding=venmo&currency=USD">
</script>

<script>
paypal.HostedButtons({
  hostedButtonId: "2FGRU9WXMWF8U",
}).render("#paypal-container-2FGRU9WXMWF8U");
</script>

<!-- COUNTER SCRIPT -->
<script>
(function(){

    let today = localStorage.getItem("today") || 0;
    let yesterday = localStorage.getItem("yesterday") || 0;
    let all = localStorage.getItem("all") || 0;

    const lastVisit = localStorage.getItem("lastVisit");
    const now = new Date().toDateString();

    if(lastVisit !== now){
        yesterday = today;
        today = 0;
    }

    today = parseInt(today) + 1;
    all = parseInt(all) + 1;

    localStorage.setItem("today", today);
    localStorage.setItem("yesterday", yesterday);
    localStorage.setItem("all", all);
    localStorage.setItem("lastVisit", now);

    document.getElementById("today").innerText = today;
    document.getElementById("yesterday").innerText = yesterday;
    document.getElementById("all").innerText = all;

    document.getElementById("online").innerText = 1;

})();
</script>

<!-- CURSOR JS -->
<script src="js/cursor.js?v=2"></script>

</body>
</html>
