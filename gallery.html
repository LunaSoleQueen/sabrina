<!DOCTYPE html>
<html>
<head>
<title>Gallery</title>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="css/bootstrap.min.css">
<link rel="stylesheet" href="css/font-awesome.min.css">
<link rel="stylesheet" href="css/templatemo_style.css">

<link rel="stylesheet" href="css/cursor.css?v=2">

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow-x: hidden;
  cursor: none !important;
}

body {
  background: transparent !important;
}

/* BACKGROUND */
#bg-video {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -1;
}

.container {
  position: relative;
  z-index: 1;
}

/* MENU (LUXURY GOLD CENTER) */
.navbar-nav {
  width: 100%;
  text-align: center;
}

.navbar-nav > li {
  float: none;
  display: inline-block;
}

.navbar-nav > li > a {
  color: #d4af37 !important;
  font-weight: 600;
  letter-spacing: 2px;
}

.navbar-nav > li > a:hover {
  color: #fff !important;
}

/* GALLERY GRID */
.gallery-row {
  display: flex;
  flex-wrap: wrap;
  margin-top: 20px;
}

.gallery-item {
  padding: 10px;
}

.gallery-box {
  background: rgba(130, 70, 200, 0.5);
  padding: 10px;
  border-radius: 10px;
  transition: 0.3s;
}

.gallery-box:hover {
  transform: scale(1.03);
}

.gallery-img {
  width: 100%;
  border-radius: 6px;
  cursor: pointer;
}

/* LIGHTBOX (NOT FULLSCREEN FEEL) */
#lightbox {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.85);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

#lightbox-content {
  position: relative;
  max-width: 80%;
  max-height: 80%;
}

#lightbox img {
  width: 100%;
  height: auto;
  border-radius: 10px;
}

/* CLOSE BUTTON */
#close-btn {
  position: absolute;
  top: -15px;
  right: -15px;
  background: #d4af37;
  color: #000;
  border: none;
  border-radius: 50%;
  width: 35px;
  height: 35px;
  font-weight: bold;
  cursor: pointer;
}
</style>

</head>

<body>

<div class="cursor-dot"></div>

<video autoplay muted loop playsinline id="bg-video">
  <source src="images/web_bg_kicsi.mp4" type="video/mp4">
</video>

<!-- MENU -->
<div class="container menu">
  <div class="row">
    <div class="col-sm-12">
      <ul class="nav navbar-nav">
        <li><a href="index.html">HOME</a></li>
        <li><a href="about.html">ABOUT</a></li>
        <li class="current"><a href="gallery.html">GALLERY</a></li>
        <li><a href="contact.html">CONTACT</a></li>
      </ul>
    </div>
  </div>
</div>

<!-- GALLERY -->
<div class="container">
  <div class="row gallery-row">

    <script>
      const images = [
        "P1090633 f.jpg",
        "P1090765 f.jpg",
        "P1100761H_f.jpg",
        "P1100772H_f.jpg",
        "P1100831H_f.JPG",
        "P1110027H.jpg",
        "P1110131H_f.jpg",
        "9 f.jpg",
        "P1090315 f.JPG"
      ];

      document.write(
        images.map(img => `
          <div class="col-sm-4 gallery-item">
            <div class="gallery-box">
              <img src="images/gallery/${img}" class="gallery-img" onclick="openLightbox(this)">
            </div>
          </div>
        `).join('')
      );
    </script>

  </div>
</div>

<!-- LIGHTBOX -->
<div id="lightbox">
  <div id="lightbox-content">
    <button id="close-btn" onclick="closeLightbox()">✕</button>
    <img id="lightbox-img">
  </div>
</div>

<script src="js/jquery-1.11.1.min.js"></script>

<script>
function openLightbox(el){
  $("#lightbox").fadeIn();
  $("#lightbox-img").attr("src", el.src);
}

function closeLightbox(){
  $("#lightbox").fadeOut();
}

$("#lightbox").click(function(e){
  if(e.target.id === "lightbox"){
    closeLightbox();
  }
});

$(document).keydown(function(e){
  if(e.key === "Escape"){
    closeLightbox();
  }
});
</script>

<script src="js/cursor.js?v=2"></script>

</body>
</html>
