<!DOCTYPE html>
<html>
<head>
<title>Gallery</title>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="css/bootstrap.min.css">
<link rel="stylesheet" href="css/font-awesome.min.css">
<link rel="stylesheet" href="css/cursor.css?v=2">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow-x: hidden;
  font-family: 'Montserrat', sans-serif;
  cursor: none !important;
}

/* BACKGROUND */
#bg-video {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -2;
}

/* DARK OVERLAY */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at center,
    rgba(0,0,0,0.35),
    rgba(0,0,0,0.88)
  );
  z-index: -1;
}

/* NAVBAR */
.navbar-nav {
  width: 100%;
  text-align: center;
}

.navbar-nav > li {
  float: none;
  display: inline-block;
}

.navbar-nav > li > a {
  color: #d4af37 !important;
  font-weight: 600;
  letter-spacing: 2px;
}

.navbar-nav > li > a:hover {
  color: #fff !important;
}

/* GRID WRAPPER */
.gallery-wrap {
  max-width: 1200px;
  margin: 80px auto;
  padding: 0 20px;
}

/* CARD */
.gallery-box {
  background: rgba(130, 70, 200, 0.14);
  border: 1px solid rgba(212, 175, 55, 0.25);
  border-radius: 16px;
  padding: 10px;
  margin-bottom: 25px;

  backdrop-filter: blur(10px);
  transition: 0.3s ease;
}

.gallery-box:hover {
  transform: translateY(-5px);
  box-shadow: 0 0 25px rgba(212,175,55,0.15);
}

/* IMAGE */
.gallery-img {
  width: 100%;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.3s;
}

.gallery-img:hover {
  transform: scale(1.02);
}

/* LIGHTBOX */
#lightbox {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;

  background: rgba(0,0,0,0.92);
  z-index: 9999;
  padding: 80px; /* NEM ÉR KI A SZÉLÉIG */
  box-sizing: border-box;
}

/* IMAGE INSIDE */
#lightbox img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  border-radius: 14px;
  box-shadow: 0 0 40px rgba(0,0,0,0.6);
}

/* CLOSE */
#close-btn {
  position: absolute;
  top: 25px;
  right: 25px;

  width: 42px;
  height: 42px;
  border-radius: 50%;

  border: none;
  background: #d4af37;
  color: #000;
  font-weight: bold;

  cursor: pointer;
}
</style>

</head>

<body>

<div class="cursor-dot"></div>

<!-- BACKGROUND -->
<video autoplay muted loop playsinline id="bg-video">
  <source src="images/web_bg_kicsi.mp4" type="video/mp4">
</video>

<!-- MENU -->
<div class="container menu">
  <div class="row">
    <div class="col-sm-12">
      <ul class="nav navbar-nav">
        <li><a href="index.html">HOME</a></li>
        <li><a href="about.html">ABOUT</a></li>
        <li class="current"><a href="gallery.html">GALLERY</a></li>
        <li><a href="contact.html">CONTACT</a></li>
      </ul>
    </div>
  </div>
</div>

<!-- GALLERY -->
<div class="gallery-wrap">
  <div class="row">

    <div class="col-sm-4">
      <div class="gallery-box">
        <img src="images/gallery/P1090633 f.jpg" class="gallery-img" onclick="openLightbox(this)">
      </div>
    </div>

    <div class="col-sm-4">
      <div class="gallery-box">
        <img src="images/gallery/P1090765 f.jpg" class="gallery-img" onclick="openLightbox(this)">
      </div>
    </div>

    <div class="col-sm-4">
      <div class="gallery-box">
        <img src="images/gallery/P1100761H_f.jpg" class="gallery-img" onclick="openLightbox(this)">
      </div>
    </div>

    <div class="col-sm-4">
      <div class="gallery-box">
        <img src="images/gallery/P1100772H_f.jpg" class="gallery-img" onclick="openLightbox(this)">
      </div>
    </div>

    <div class="col-sm-4">
      <div class="gallery-box">
        <img src="images/gallery/P1100831H_f.JPG" class="gallery-img" onclick="openLightbox(this)">
      </div>
    </div>

    <div class="col-sm-4">
      <div class="gallery-box">
        <img src="images/gallery/P1110027H.jpg" class="gallery-img" onclick="openLightbox(this)">
      </div>
    </div>

    <div class="col-sm-4">
      <div class="gallery-box">
        <img src="images/gallery/P1110131H_f.jpg" class="gallery-img" onclick="openLightbox(this)">
      </div>
    </div>

    <div class="col-sm-4">
      <div class="gallery-box">
        <img src="images/gallery/9 f.jpg" class="gallery-img" onclick="openLightbox(this)">
      </div>
    </div>

    <div class="col-sm-4">
      <div class="gallery-box">
        <img src="images/gallery/P1090315 f.JPG" class="gallery-img" onclick="openLightbox(this)">
      </div>
    </div>

  </div>
</div>

<!-- LIGHTBOX -->
<div id="lightbox">
  <button id="close-btn" onclick="closeLightbox()">✕</button>
  <img id="lightbox-img">
</div>

<script>
function openLightbox(el){
  const lb = document.getElementById("lightbox");
  const img = document.getElementById("lightbox-img");

  lb.style.display = "flex";
  img.src = el.src;
}

function closeLightbox(){
  document.getElementById("lightbox").style.display = "none";
}

document.addEventListener("keydown", function(e){
  if(e.key === "Escape"){
    closeLightbox();
  }
});
</script>

<script src="js/cursor.js?v=2"></script>

</body>
</html>
