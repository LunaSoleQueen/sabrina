<!DOCTYPE html>
<html>
<head>
<title>Gallery</title>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="css/bootstrap.min.css">
<link rel="stylesheet" href="css/font-awesome.min.css">
<link rel="stylesheet" href="css/templatemo_style.css">
<link rel="stylesheet" href="css/cursor.css?v=2">

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow-x: hidden;
  cursor: none !important;
}

body {
  background: transparent !important;
}

/* BACKGROUND */
#bg-video {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -1;
}

.container {
  position: relative;
  z-index: 1;
}

/* NAVBAR CENTER + GOLD */
.navbar-nav {
  width: 100%;
  text-align: center;
}

.navbar-nav > li {
  float: none;
  display: inline-block;
}

.navbar-nav > li > a {
  color: #d4af37 !important;
  font-weight: 600;
  letter-spacing: 2px;
}

/* GALLERY GRID FIX */
.gallery-row {
  margin-top: 20px;
}

.gallery-box {
  background: rgba(130, 70, 200, 0.5);
  padding: 10px;
  border-radius: 10px;
  margin-bottom: 20px;
  transition: 0.3s;
}

.gallery-box:hover {
  transform: scale(1.02);
}

.gallery-img {
  width: 100%;
  border-radius: 6px;
  cursor: pointer;
}

/* LIGHTBOX FIXED (NO OVER-ZOOM) */
#lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  padding: 60px; /* EZ A LÉNYEG: ne érjen a szélekhez */
  box-sizing: border-box;
}

#lightbox img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain; /* EZ MEGAKADÁLYOZZA A BRUTÁL ZOOMOT */
  border-radius: 10px;
}

/* CLOSE BUTTON */
#close-btn {
  position: absolute;
  top: 15px;
  right: 15px;
  background: #d4af37;
  color: #000;
  border: none;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  font-weight: bold;
  cursor: pointer;
}
</style>

</head>

<body>

<div class="cursor-dot"></div>

<video autoplay muted loop playsinline id="bg-video">
  <source src="images/web_bg_kicsi.mp4" type="video/mp4">
</video>

<!-- MENU -->
<div class="container menu">
  <div class="row">
    <div class="col-sm-12">
      <ul class="nav navbar-nav">
        <li><a href="index.html">HOME</a></li>
        <li><a href="about.html">ABOUT</a></li>
        <li class="current"><a href="gallery.html">GALLERY</a></li>
        <li><a href="contact.html">CONTACT</a></li>
      </ul>
    </div>
  </div>
</div>

<!-- GALLERY -->
<div class="container">
  <div class="row gallery-row">

    <div class="col-sm-4">
      <div class="gallery-box">
        <img src="images/gallery/P1090633 f.jpg" class="gallery-img" onclick="openLightbox(this)">
      </div>
    </div>

    <div class="col-sm-4">
      <div class="gallery-box">
        <img src="images/gallery/P1090765 f.jpg" class="gallery-img" onclick="openLightbox(this)">
      </div>
    </div>

    <div class="col-sm-4">
      <div class="gallery-box">
        <img src="images/gallery/P1100761H_f.jpg" class="gallery-img" onclick="openLightbox(this)">
      </div>
    </div>

    <div class="col-sm-4">
      <div class="gallery-box">
        <img src="images/gallery/P1100772H_f.jpg" class="gallery-img" onclick="openLightbox(this)">
      </div>
    </div>

    <div class="col-sm-4">
      <div class="gallery-box">
        <img src="images/gallery/P1100831H_f.JPG" class="gallery-img" onclick="openLightbox(this)">
      </div>
    </div>

    <div class="col-sm-4">
      <div class="gallery-box">
        <img src="images/gallery/P1110027H.jpg" class="gallery-img" onclick="openLightbox(this)">
      </div>
    </div>

    <div class="col-sm-4">
      <div class="gallery-box">
        <img src="images/gallery/P1110131H_f.jpg" class="gallery-img" onclick="openLightbox(this)">
      </div>
    </div>

    <div class="col-sm-4">
      <div class="gallery-box">
        <img src="images/gallery/9 f.jpg" class="gallery-img" onclick="openLightbox(this)">
      </div>
    </div>

    <div class="col-sm-4">
      <div class="gallery-box">
        <img src="images/gallery/P1090315 f.JPG" class="gallery-img" onclick="openLightbox(this)">
      </div>
    </div>

  </div>
</div>

<!-- LIGHTBOX -->
<div id="lightbox">
  <button id="close-btn" onclick="closeLightbox()">✕</button>
  <img id="lightbox-img">
</div>

<script>
function openLightbox(el){
  document.getElementById("lightbox").style.display = "flex";
  document.getElementById("lightbox-img").src = el.src;
}

function closeLightbox(){
  document.getElementById("lightbox").style.display = "none";
}

document.getElementById("lightbox").addEventListener("click", function(e){
  if(e.target.id === "lightbox"){
    closeLightbox();
  }
});

document.addEventListener("keydown", function(e){
  if(e.key === "Escape"){
    closeLightbox();
  }
});
</script>

<script src="js/cursor.js?v=2"></script>

</body>
</html>
