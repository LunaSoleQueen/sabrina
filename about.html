<!DOCTYPE html>
<html>
<head>
<title>About</title>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="css/bootstrap.min.css">
<link rel="stylesheet" href="css/font-awesome.min.css">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow-x: hidden;
  font-family: 'Montserrat', sans-serif;
  color: #fff;
}

/* BACKGROUND VIDEO */
#bg-video {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -2;
}

/* DARK OVERLAY (EZ ADJA A CINEMATIC HATÁST) */
.overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: radial-gradient(
    circle at center,
    rgba(0,0,0,0.4),
    rgba(0,0,0,0.85)
  );
  z-index: -1;
}

/* NAVBAR */
.navbar-nav {
  width: 100%;
  text-align: center;
  margin-top: 20px;
}

.navbar-nav > li {
  float: none;
  display: inline-block;
}

.navbar-nav > li > a {
  color: #d4af37 !important;
  font-weight: 600;
  letter-spacing: 2px;
  transition: 0.3s;
}

.navbar-nav > li > a:hover {
  color: #ffffff !important;
}

/* CENTER CONTAINER */
.center-wrap {
  height: 80vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

/* GLASS CARD */
.glass-card {
  max-width: 900px;
  width: 100%;
  padding: 60px 40px;
  text-align: center;

  background: rgba(130, 70, 200, 0.18);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 20px;

  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);

  box-shadow: 0 0 40px rgba(212, 175, 55, 0.15);

  animation: fadeIn 1.2s ease forwards;
  opacity: 0;
}

/* TITLE */
.glass-card h1 {
  font-size: 42px;
  letter-spacing: 4px;
  margin-bottom: 20px;
  color: #d4af37;
}

/* TEXT */
.glass-card p {
  font-size: 16px;
  line-height: 1.9;
  font-weight: 300;
  color: #f5f5f5;
}

/* ANIMATION */
@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>

</head>

<body>

<!-- BACKGROUND -->
<video autoplay muted loop playsinline id="bg-video">
  <source src="images/web_bg_kicsi.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<!-- MENU -->
<div class="container menu">
  <div class="row">
    <div class="col-sm-12">
      <ul class="nav navbar-nav">
        <li><a href="index.html">HOME</a></li>
        <li class="current"><a href="about.html">ABOUT</a></li>
        <li><a href="gallery.html">GALLERY</a></li>
        <li><a href="contact.html">CONTACT</a></li>
      </ul>
    </div>
  </div>
</div>

<!-- CONTENT -->
<div class="center-wrap">
  <div class="glass-card">

    <h1>WELCOME TO MY KINGDOM</h1>

    <p>
      Step inside and explore freely.<br><br>
      Here, refined sensuality meets luxury aesthetics, creating a world of soft intensity and elegance.<br><br>
      Let yourself drift into the atmosphere… and become part of it.
    </p>

  </div>
</div>

</body>
</html>
